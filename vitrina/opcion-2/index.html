<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de colecciones · Opción 2</title>
<link rel="stylesheet" href="/estilos.css">
</head>
<body>
<div id="app"></div>
<script>
  window.TIENDA = {
    api: "/api/op2/publicado",
    opcion: "Opción 2 · Plataforma",
    aviso: "<b>Publicado por la plataforma central</b> · solo productos con precio, foto y categoría",
    pie: "Demo Orquestia · Opción 2 · catálogo publicado automáticamente por la plataforma central",
    acciones: '<a href="plataforma.html">Plataforma</a>',
    campoFecha: "publicado_en_fuente",
    esNuevo: p => (p.publicado_en_fuente || "") >= new Date(Date.now() - 14 * 864e5).toISOString().slice(0, 10)
      || (p.publicado_en || "") >= new Date(Date.now() - 3 * 864e5).toISOString() && (p.primera_vez || "") >= new Date(Date.now() - 3 * 864e5).toISOString(),
    heroDetalle: () => "publicadas por la plataforma",
  };
</script>
<script src="/tienda.js"></script>
</body>
</html>
